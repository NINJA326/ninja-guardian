<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <title>NINJA AIRS 保護者</title>

  <link
    rel="stylesheet"
    href="./css/base.css?v=step30"
  >
</head>

<body>
  <main
    class="app-shell"
    id="app"
  >
    <section
      class="status-card"
      aria-labelledby="app-title"
    >
      <p class="eyebrow">
        NINJA AIRS
      </p>

      <h1 id="app-title">
        保護者ページ
      </h1>

      <p
        id="app-status"
        class="status-text"
        aria-live="polite"
      >
        LINE認証を確認しています…
      </p>

      <section
        id="invite-section"
        hidden
        aria-labelledby="invite-title"
      >
        <h2 id="invite-title">
          保護者登録
        </h2>

        <p>
          チームから案内された招待コードを入力してください。
        </p>

        <form
          id="invite-form"
          novalidate
        >
          <label for="invite-code">
            招待コード
          </label>

          <input
            id="invite-code"
            name="inviteCode"
            type="text"
            inputmode="text"
            autocomplete="off"
            autocapitalize="characters"
            maxlength="10"
            required
          >

          <button
            id="invite-submit"
            type="submit"
          >
            保護者登録
          </button>
        </form>

        <p
          id="invite-status"
          aria-live="polite"
        ></p>
      </section>
    </section>
  </main>

  <script
    src="https://static.line-scdn.net/liff/edge/2/sdk.js"
  ></script>

  <script src="./js/config.js?v=step30"></script>
  <script src="./js/api.js?v=step30"></script>
  <script src="./js/app.js?v=step30"></script>
</body>
</html>
